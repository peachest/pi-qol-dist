name: build-from-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "kendex ref to build from (branch/commit)"
        default: "main"
  schedule:
    - cron: "0 3 * * *"   # daily check for upstream changes

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream pi-qol source
        run: |
          REF="${{ github.event.inputs.upstream_ref || 'main' }}"
          rm -rf src
          # sparse checkout of the monorepo subdirectory
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/vanillagreencom/kendex.git upstream-src
          cd upstream-src
          git sparse-checkout set pi-extensions/pi-qol
          git checkout "$REF" 2>/dev/null || git checkout origin/main
          cd ..
          mkdir -p src
          cp -r upstream-src/pi-extensions/pi-qol/{package.json,extensions,scripts} src/
          echo "UPSTREAM_VERSION=$(python3 -c "import json;print(json.load(open('src/package.json'))['version'])")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild bundle
        run: ./build.sh

      - name: Detect change & commit + tag
        id: diff
        run: |
          git config user.name "pi-qol-dist bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            UPV="${UPSTREAM_VERSION:-unknown}"
            # bump build number
            LAST=$(git tag --list "v$UPV-b*" --sort=-v:refname | head -1 | sed "s/.*-b//" || echo 0)
            BUILD=$(( ${LAST:-0} + 1 ))
            TAG="v$UPV-b$BUILD"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            git commit -m "build: upstream @vanillagreen/pi-qol $UPV (bundle $TAG)

            Auto-built by .github/workflows/build.yml from
            vanillagreencom/kendex@$REF (pi-extensions/pi-qol)."
            git tag "$TAG"
            echo "Sync upstream snapshot into src/ too" 
            git push origin HEAD:"$GITHUB_REF_NAME" --follow-tags 2>/dev/null || git push --tags
          fi

      - name: Push source snapshot + tag
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add -f src/
          git commit -m "src: upstream snapshot ${UPSTREAM_VERSION}" || true
          git push origin HEAD
          git push origin "${{ steps.diff.outputs.tag }}" || true

      - name: Update floating branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git push origin HEAD:refs/heads/dist-main --force
